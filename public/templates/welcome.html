<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to AxeDz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f7;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #007BFF;
            margin: 0;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="AxeDz Logo" class="logo">
        <div class="header">
            <h1>Welcome to AxeDz</h1>
        </div>
        <p>Hello,</p>
        <p>Thank you for signing up with AxeDz. We're excited to have you on board!</p>
        <p>Get started by exploring your dashboard and discovering all the features we offer.</p>
        <a class="btn" href="{{FRONT_SIDE_URL}}" target="_blank">Visit Dashboard</a>
        <div class="footer">
            <p>If you have any questions, feel free to contact our support team.</p>
            <p>Thank you for choosing AxeDz!</p>
        </div>
    </div>
</body>
</html>
